when:
  - event: push
    branch: main
  - event: manual
    branch: main

steps:
  - name: check
    image: golang:1.26.6-bookworm@sha256:433f9dc4f8ea3a1ce4e28f9f15d0f7c056b10475307f886d6f1ac1ccc4abd976
    commands:
      - apt-get update
      - apt-get install --yes --no-install-recommends ripgrep
      - ./scripts/check
