name: Bug report
description: Report reproducible incorrect behavior using synthetic data only.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach databases, statements, exports, account numbers, balances,
        tax records, or other real financial information. Security issues belong
        in GitHub private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Books version
      description: Output of `books --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Explain what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal commands using a new disposable BOOKS_HOME.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data safety
      options:
        - label: This report contains only synthetic data and no existing Books database was opened.
          required: true
        - label: This is not a security vulnerability.
          required: true
