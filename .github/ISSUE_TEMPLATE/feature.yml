name: Feature proposal
description: Propose a narrowly scoped addition or change.
title: "proposal: "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the bookkeeping or automation problem, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and non-goals
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Accounting, security, and compatibility considerations
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data safety
      options:
        - label: This proposal contains no private financial or company data.
          required: true
